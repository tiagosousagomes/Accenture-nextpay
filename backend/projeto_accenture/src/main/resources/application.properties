spring.application.name=nextpay

spring.datasource.url=jdbc:h2:mem:nextpaydb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

gemini.api.key=GEMINI_API_KEY

logging.level.dev.langchain4j=DEBUG

jwt.secret=nextpay-accenture-chave-secreta-muito-longa-para-seguranca-jwt-2024
jwt.expiration=86400000

cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Email configuration (configure with real SMTP credentials)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true